name: Lighthouse Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest

    steps:
      # Step 0: setup /clean and fresh install
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Clean install dependencies
        run: |
          rm -rf node_modules
          npm ci

      # Optional hardening fallback for npm optional dependency bug:
      - name: Verify Tailwind oxide binary
        run: |
          node -e "require('@tailwindcss/oxide')"
        continue-on-error: true

      - name: Reinstall if oxide is missing
        if: ${{ failure() }}
        run: |
          rm -rf node_modules package-lock.json
          npm install

      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build the project
      - name: Build Project
        run: npm run build

      # Step 5: Install Lighthouse CI
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      # Step 6: Start a local server in background
      - name: Start Server
        run: |
          npx serve dist -l 3000 &
          sleep 5

      # Step 7: Run Lighthouse CI
      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_BUILD_CONTEXT: 'pr'

      # Step 8: Upload Lighthouse results as artifacts
      - name: Upload Lighthouse Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
